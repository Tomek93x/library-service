services:
  db:
    image: postgres:15-alpine
    container_name: library-service-db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: library_db
      POSTGRES_USER: library_user
      POSTGRES_PASSWORD: library_password
    ports:
      - "5433:5432"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: library-service-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  web:
    build: .
    container_name: library-service-web
    command: sh -c "sleep 20 && python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DEBUG=True
      - DB_HOST=db
      - DB_NAME=library_db
      - DB_USER=library_user
      - DB_PASSWORD=library_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    restart: unless-stopped

  qcluster:
    build: .
    container_name: library-service-qcluster
    command: sh -c "sleep 30 && python manage.py qcluster"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - DEBUG=True
      - DB_HOST=db
      - DB_NAME=library_db
      - DB_USER=library_user
      - DB_PASSWORD=library_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    restart: unless-stopped

volumes:
  postgres_data:
